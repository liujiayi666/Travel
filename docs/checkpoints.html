<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Copilot — 学习 Checkpoints</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --ink: #1a1d21; --muted: #6b7280;
    --line: #e5e7eb; --accent: #176b4d; --accent-soft: #e8f3ed;
    --code: #f1f3f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.7 -apple-system, "PingFang SC", "Segoe UI", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 32px; }
  .cp {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 20px; margin-bottom: 16px;
  }
  .cp header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .id {
    font: 12.5px/1 ui-monospace, Menlo, monospace; color: var(--accent);
    background: var(--accent-soft); padding: 5px 8px; border-radius: 6px;
  }
  time { color: var(--muted); font-size: 12.5px; }
  .cp h2 { font-size: 16px; margin: 0; }
  .cp ul { margin: 6px 0 10px; padding-left: 20px; }
  .cp li { margin: 3px 0; }
  .cp code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .cp blockquote {
    margin: 0; padding: 8px 12px; border-left: 3px solid var(--accent);
    background: var(--accent-soft); border-radius: 0 6px 6px 0;
    color: #134934; font-size: 13.5px;
  }
  .empty { color: var(--muted); font-size: 13.5px; text-align: center; padding: 48px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>学习 Checkpoints</h1>
  <p class="sub">每次 /accept 验收通过后，由 Claude 先问"你学到了什么"，再结合 diff 追加一条。id = commit hash。</p>

  <div id="list">
    <p class="empty">还没有条目 — 第一次 /accept 后出现第一条。</p>
  </div>
</div>
</body>
</html>
